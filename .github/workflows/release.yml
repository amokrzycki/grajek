name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.6.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag and verify version
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          version=$(git show "$sha:Cargo.toml" | python3 -I -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $version at $sha"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  release:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate and verify checksums
        working-directory: dist
        run: |
          sha256sum *.AppImage *.exe *.tar.gz *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create draft release
        run: |
          if [ "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" != "$SHA" ]; then
            echo "::error::Tag $TAG no longer points at $SHA"
            exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --draft \
            --title "Grajek $TAG" --generate-notes

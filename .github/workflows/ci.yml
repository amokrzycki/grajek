name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config libopus-dev \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev \
            libssl-dev libzstd-dev libvulkan-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --all-features
      - name: Build native application
        run: cargo build --locked

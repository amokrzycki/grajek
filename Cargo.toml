[package]
name = "discord-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
gpui-kit = "=0.7.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
serde_json = "1"
songbird = "=0.6.1"
symphonia = { version = "0.5", default-features = false, features = ["mkv", "isomp4", "aac"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
